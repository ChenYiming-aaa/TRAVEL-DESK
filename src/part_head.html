<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EC">
<meta name="description" content="旅行工作台 TRAVEL DESK：以中国地图为视觉锚点的个人旅行手账。点亮去过的省份、标记种草目的地、记录每座城市的一句话记忆；行程规划、交通深链、成就体系、存档快照，单文件离线可用。">
<meta property="og:type" content="website">
<meta property="og:title" content="旅行工作台 · TRAVEL DESK">
<meta property="og:description" content="装得下整张中国地图的旅行手账：去过点亮、种草标记、行程规划、交通深链、成就体系。单文件，零依赖，离线可用。">
<meta name="twitter:card" content="summary_large_image">
<title>旅行工作台 · TRAVEL DESK</title>
<style>
/* ============================================================
   旅行工作台 · 像素游戏风 + 清新手账感
   全局奶油底 #FBF6EC / 卡片 #FFFDF8 / 像素描边 / 焦糖色系
   ============================================================ */
:root{
  --bg:#FBF6EC;
  --card:#FFFDF8;
  --ink:#2F2A26;
  --ink-soft:#7A6C5C;
  --ink-faint:#8A7D6D;
  --line:#2F2A26;
  --sel-bg:#FBEBD7;
  --press-bg:#F6E9D2;
  --caramel:#C8763C;
  --caramel-deep:#A85B1F;
  --caramel-light:#F0BE8A;
  --cream-orange:#E8A15C;
  --red:#C0392B;
  --red-soft:#F7E3DF;
  --green:#4E8A5A;
  --green-soft:#E4EFE4;
  --gray-cream:#EFE9DC;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,"Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --shadow:4px 4px 0 rgba(47,42,38,.16);
  --shadow-sm:3px 3px 0 rgba(47,42,38,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  background-image:radial-gradient(rgba(47,42,38,.045) 1px,transparent 1px);
  background-size:22px 22px;
}
h1,h2,h3,h4{margin:0;font-weight:700}
button{font-family:var(--sans);cursor:pointer}
input,select,textarea{font-family:var(--sans);font-size:16px;color:var(--ink)}
.hidden{display:none!important}
::selection{background:var(--cream-orange);color:#fff}

/* ---------- 像素构件 ---------- */
.card{
  position:relative;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:6px;
  box-shadow:var(--shadow);
  padding:14px 16px;
  margin:0 0 16px;
}
.card-tape{
  position:absolute;top:-11px;left:22px;width:74px;height:20px;
  background:linear-gradient(180deg,rgba(232,161,92,.55),rgba(232,161,92,.38));
  border-left:1px dashed rgba(47,42,38,.25);border-right:1px dashed rgba(47,42,38,.25);
  transform:rotate(-3deg);
}
.card-tape.right{left:auto;right:26px;transform:rotate(4deg);background:linear-gradient(180deg,rgba(122,155,109,.45),rgba(122,155,109,.3))}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:9px 16px;
  background:var(--card);border:2px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow-sm);
  font-size:14px;font-weight:700;color:var(--ink);
  transition:transform .06s,box-shadow .06s;
  user-select:none;
}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 rgba(0,0,0,0)}
.btn.primary{background:var(--caramel);color:#FFFDF8;border-color:var(--line)}
.btn.primary:active{background:var(--caramel-deep)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn.small{min-height:34px;padding:4px 10px;font-size:13px;box-shadow:2px 2px 0 rgba(47,42,38,.16)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.green{color:var(--green);border-color:var(--green)}
.btn svg{flex:none}
.icon-btn{
  width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--card);border:2px solid var(--line);border-radius:6px;box-shadow:var(--shadow-sm);
}
.icon-btn:active{transform:translate(2px,2px);box-shadow:none}
.tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink);
  font-family:var(--mono);
}
.tag.caramel{background:var(--sel-bg)}
.tag.red{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.tag.green{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.tag.gray{background:var(--gray-cream);color:var(--ink-soft)}
.dashed{border-top:2px dashed rgba(47,42,38,.28);margin:12px 0}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-soft)}
.small{font-size:13px}

/* ---------- 顶栏 ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;
  background:rgba(251,246,236,.92);
  backdrop-filter:blur(6px);
  border-bottom:2px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-badge{
  width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--caramel);border:2px solid var(--line);border-radius:6px;box-shadow:var(--shadow-sm);
}
.brand-txt{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-txt b{font-size:16px;font-family:var(--mono);letter-spacing:.5px}
.brand-txt small{font-size:10px;color:var(--ink-soft);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:8px;flex:none}
.level-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:2px solid var(--line);border-radius:6px;box-shadow:var(--shadow-sm);
  padding:5px 10px;font-family:var(--mono);font-weight:700;font-size:13px;
}
.expbar{
  width:72px;height:12px;border:2px solid var(--line);border-radius:3px;
  background:#F3EAD8;overflow:hidden;position:relative;
}
.expbar>i{
  display:block;height:100%;
  background:repeating-linear-gradient(90deg,var(--caramel) 0 5px,#E09A5F 5px 7px);
  transition:width .5s cubic-bezier(.2,.8,.3,1);
}
.expbar.mini{width:44px;height:9px}

/* ---------- 同步状态条 ---------- */
.sync-bar{
  display:flex;align-items:center;gap:10px;
  background:#FDF0DC;border-bottom:2px dashed var(--caramel);
  padding:8px 14px;font-size:13px;font-weight:700;color:var(--caramel-deep);
}
.sync-bar .btn{margin-left:auto}
.sync-dot{width:10px;height:10px;border:2px solid var(--line);border-radius:2px;flex:none}
.sync-dot.ok{background:var(--green)}
.sync-dot.syncing{background:var(--cream-orange);animation:blink 1s steps(2) infinite}
.sync-dot.off{background:var(--red)}
@keyframes blink{50%{opacity:.25}}

/* ---------- 视图容器 ---------- */
#views{max-width:900px;margin:0 auto;padding:14px 14px 96px}
.view{display:none}
/* 入场动画不要 fill-mode:both——保留的 transform 会让 .view 成为 fixed 后代的 containing block，
   FAB / 批量操作栏等 fixed 元素会被错误定位 */
.view.active{display:block;animation:viewIn .25s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.view-head h2{font-size:19px;font-family:var(--mono)}
.view-head .sub{font-size:12px;color:var(--ink-soft);font-family:var(--mono)}

/* ---------- 今天要处理 ---------- */
.today-card{
  position:relative;background:var(--card);border:2px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
}
.today-head{
  display:flex;align-items:center;gap:8px;padding:9px 14px;
  background:repeating-linear-gradient(135deg,#F6E3C6 0 10px,#F1D9B6 10px 20px);
  border-bottom:2px solid var(--line);
  font-family:var(--mono);font-weight:700;font-size:14px;
}
.today-body{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.today-item{
  display:flex;align-items:center;gap:10px;
  border:2px dashed rgba(47,42,38,.3);border-radius:6px;padding:8px 10px;background:#fff;
}
.today-item.overdue{border-color:var(--red);background:var(--red-soft)}
.today-item .t-title{flex:1;min-width:0;font-size:14px;font-weight:600}
.today-item.overdue .t-title{color:var(--red);font-weight:700}
.today-item .t-date{font-family:var(--mono);font-size:12px;color:var(--ink-soft);flex:none}
.today-item.overdue .t-date{color:var(--red)}
.today-empty{padding:12px 14px;color:var(--ink-soft);font-size:13px}

/* ---------- 统计条 ---------- */
.stats-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--ink);color:#FBF6EC;border:2px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow-sm);padding:9px 14px;margin-bottom:12px;cursor:pointer;
  font-family:var(--mono);font-size:14px;font-weight:700;
}
.stats-bar:active{transform:translate(2px,2px)}
.stats-bar .num{color:var(--cream-orange);font-size:17px}
.stats-bar .go{margin-left:auto;font-size:12px;color:var(--caramel-light);display:flex;align-items:center;gap:4px}
.stats-bar .seg{white-space:nowrap}

/* ---------- 地图 ---------- */
#map-shell{
  position:relative;
  height:clamp(430px,56vh,600px);
  background:var(--card);
  border:2px solid var(--line);border-radius:6px;box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:16px;
}
#china-map{width:100%;height:100%;animation:mapIn .6s cubic-bezier(.2,.75,.3,1) both}
@keyframes mapIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
#map-hint{
  position:absolute;right:10px;bottom:8px;z-index:5;pointer-events:none;
  font-size:11px;font-family:var(--mono);color:var(--ink-faint);
  background:rgba(255,253,248,.8);padding:2px 8px;border-radius:4px;border:1px dashed rgba(47,42,38,.25);
}
.map-loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;color:var(--ink-soft);font-family:var(--mono);font-size:13px;
  background:var(--card);z-index:6;
}

/* ---------- 信息流卡片 ---------- */
.info-flow .card{margin-bottom:16px}
.card-title{
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-weight:700;font-size:14px;margin-bottom:10px;
}
.card-title .dot{width:8px;height:8px;background:var(--caramel);border:1.5px solid var(--line);border-radius:2px}
.card-title .right{margin-left:auto;font-size:12px;color:var(--ink-soft);font-weight:400;font-family:var(--sans)}
.profile-row{display:flex;align-items:center;gap:12px}
.avatar{
  width:52px;height:52px;flex:none;border:2px solid var(--line);border-radius:6px;
  background:repeating-linear-gradient(45deg,#F6E3C6 0 6px,#F1D9B6 6px 12px);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:var(--shadow-sm);
}
.profile-info{flex:1;min-width:0}
.profile-info .nick{font-weight:700;font-size:16px}
.profile-info .origin{font-size:12px;color:var(--ink-soft);font-family:var(--mono)}
.style-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.recent-item{
  display:flex;gap:10px;padding:9px 0;border-bottom:1.5px dashed rgba(47,42,38,.22);
}
.recent-item:last-child{border-bottom:none}
.recent-item .r-city{font-weight:700;font-size:14px;flex:none}
.recent-item .r-city small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px;font-family:var(--mono)}
.recent-item .r-note{flex:1;font-size:13px;color:var(--ink-soft)}
.book-quote{
  font-size:15px;font-weight:600;line-height:1.7;
  padding:10px 12px;background:#FDF6E7;border-left:4px solid var(--caramel);border-radius:0 6px 6px 0;
}
.book-quote .from{display:block;margin-top:6px;font-size:11px;color:var(--ink-faint);font-family:var(--mono)}
.nexttask-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nexttask-box .nt-title{flex:1;min-width:180px;font-weight:700;font-size:14px}
.nexttask-box .nt-date{font-family:var(--mono);font-size:13px;color:var(--caramel-deep);font-weight:700}
.nexttask-box .nt-date.over{color:var(--red)}

/* ---------- 足迹库 ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select{
  flex:1;min-width:110px;max-height:44px;
  border:2px solid var(--line);border-radius:6px;background:var(--card);
  padding:9px 10px;font-size:14px;box-shadow:2px 2px 0 rgba(47,42,38,.14);
}
.foot-item{position:relative}
.foot-item .f-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.foot-item .f-city{font-weight:700;font-size:15px}
.foot-item .f-prov{font-size:12px;color:var(--caramel-deep);font-family:var(--mono);font-weight:700}
.foot-item .f-date{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
.foot-item .f-note{margin:6px 0 8px;font-size:14px}
.foot-item .f-foot{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.foot-item .f-tags{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0;flex:1}
.foot-item .f-ops{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
/* 纯文字链接式按钮（不改变现有卡片观感，只去掉按钮外框） */
.link-plain{background:none;border:none;font:inherit;color:var(--caramel-deep);cursor:pointer;padding:2px 4px;font-family:var(--mono);font-weight:700}
.link-plain:hover{text-decoration:underline}
.link-plain svg{vertical-align:-2px}
.foot-trip-link{
  font-size:12px;font-family:var(--mono);color:var(--caramel-deep);
  background:var(--sel-bg);border:1.5px solid var(--caramel);border-radius:4px;padding:2px 8px;font-weight:700;
}
.foot-trip-link:active{transform:translate(1px,1px)}
.empty{
  text-align:center;padding:34px 16px;color:var(--ink-soft);
  border:2px dashed rgba(47,42,38,.3);border-radius:6px;background:var(--card);
}
.empty .big{font-size:34px;margin-bottom:8px}

/* ---------- 行程 ---------- */
.trip-item{cursor:pointer}
/* 卡片头部：列表卡与详情卡共用（不要依赖 .trip-item 祖先，详情卡没有该祖先） */
.t-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t-head .t-name{font-weight:700;font-size:15.5px}
.t-head .t-dates{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
.trip-meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.progress{
  height:14px;border:2px solid var(--line);border-radius:3px;background:#F3EAD8;overflow:hidden;position:relative;
}
.progress>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--caramel) 0 5px,#E09A5F 5px 7px)}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);font-family:var(--mono);margin-top:4px}
#trip-detail .card{margin-bottom:14px}
.day-block{margin-bottom:14px}
.day-head{
  display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;font-size:13px;
  background:var(--press-bg);border:2px solid var(--line);border-radius:6px 6px 0 0;padding:6px 10px;
  border-bottom:none;
}
.day-items{border:2px solid var(--line);border-top:none;border-radius:0 0 6px 6px;background:#fff}
.plan-item{
  display:flex;gap:10px;padding:9px 10px;border-bottom:1.5px dashed rgba(47,42,38,.2);align-items:flex-start;
}
.plan-item:last-child{border-bottom:none}
.plan-item .p-time{
  flex:none;font-family:var(--mono);font-weight:700;font-size:12.5px;
  background:var(--ink);color:#FBF6EC;border-radius:4px;padding:2px 7px;margin-top:1px;
}
.plan-item .p-body{flex:1;min-width:0}
.plan-item .p-place{font-weight:700;font-size:13.5px}
.plan-item .p-action{font-size:13px;color:var(--ink-soft)}
.plan-item .p-note{font-size:12px;color:var(--ink-faint);margin-top:2px}
.plan-item .p-type{flex:none;font-size:11px;font-family:var(--mono);border:1.5px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--gray-cream)}
.plan-item .p-del{flex:none}
.task-row{
  display:flex;align-items:center;gap:10px;padding:9px 10px;
  border:2px dashed rgba(47,42,38,.25);border-radius:6px;margin-bottom:8px;background:#fff;
}
.task-row.soon{border-color:var(--caramel);background:#FDF3E4}
.task-row.overdue{border-color:var(--red);background:var(--red-soft)}
.task-row.done{opacity:.55}
.task-row.done .tk-title{text-decoration:line-through}
.task-row .tk-check{
  width:26px;height:26px;flex:none;border:2px solid var(--line);border-radius:4px;background:#fff;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.task-row.done .tk-check{background:var(--green);border-color:var(--green)}
.task-row .tk-body{flex:1;min-width:0}
.task-row .tk-title{font-size:13.5px;font-weight:600}
.task-row .tk-meta{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono);margin-top:2px}
.task-row.overdue .tk-meta{color:var(--red);font-weight:700}
.task-row.soon .tk-meta{color:var(--caramel-deep);font-weight:700}
.task-row .tk-link{flex:none}
.link-btn{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:12px;font-weight:700;
  border:2px solid var(--line);border-radius:5px;padding:5px 9px;background:#fff;
  color:var(--ink);text-decoration:none;box-shadow:2px 2px 0 rgba(47,42,38,.16);
}
.link-btn:active{transform:translate(2px,2px);box-shadow:none}
.link-btn.t12306{background:#FDE8E4}
.link-btn.ctrip{background:#E4EEF9}
.link-btn.qunar{background:#FDF0C8}

/* ---------- 存档 ---------- */
.save-card{
  position:relative;background:linear-gradient(180deg,#FFFDF8,#FBF1DE);
  border:2px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:20px 18px 16px;margin-bottom:16px;
  overflow:hidden;
}
.save-card::before{
  content:"";position:absolute;inset:6px;border:1.5px dashed rgba(47,42,38,.3);border-radius:5px;pointer-events:none;
}
.save-title{
  text-align:center;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:3px;
  color:var(--caramel-deep);margin-bottom:12px;
}
.save-name{text-align:center;font-size:22px;font-weight:800;margin-bottom:2px}
.save-sub{text-align:center;font-size:12px;color:var(--ink-soft);font-family:var(--mono);margin-bottom:14px}
.save-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.save-stat{
  border:2px solid var(--line);border-radius:5px;background:#fff;text-align:center;padding:8px 2px;
  box-shadow:2px 2px 0 rgba(47,42,38,.14);
}
.save-stat b{display:block;font-family:var(--mono);font-size:17px;color:var(--caramel-deep)}
.save-stat span{font-size:11px;color:var(--ink-soft)}
.save-exp{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.save-exp .expbar{flex:1;width:auto;height:16px}
.save-exp .lv{font-family:var(--mono);font-weight:800;font-size:15px;flex:none}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ach-badge{
  border:2px solid var(--line);border-radius:6px;background:#fff;text-align:center;padding:9px 4px;
  box-shadow:2px 2px 0 rgba(47,42,38,.14);
}
.ach-badge .ic{font-size:24px;line-height:1.2}
.ach-badge .nm{font-size:11.5px;font-weight:700;margin-top:3px}
.ach-badge.locked{opacity:.45;filter:grayscale(.8)}
.ach-badge .dt{font-size:10px;color:var(--ink-faint);font-family:var(--mono)}
.snap-row{
  display:flex;align-items:center;gap:10px;padding:9px 10px;
  border:2px dashed rgba(47,42,38,.25);border-radius:6px;margin-bottom:8px;background:#fff;
}
.snap-row .s-name{flex:1;min-width:0;font-weight:700;font-size:13.5px}
.snap-row .s-date{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);flex:none}
.help-list{margin:0;padding-left:18px;font-size:13px;color:var(--ink-soft)}
.help-list li{margin-bottom:6px}
.help-list code{
  font-family:var(--mono);font-size:12px;background:var(--press-bg);border:1px solid rgba(47,42,38,.25);
  border-radius:3px;padding:1px 5px;color:var(--caramel-deep);
}
.danger-zone{border-color:var(--red)}
.danger-zone .card-title{color:var(--red)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 地图悬浮浮层（只读，不拦截指针） ---------- */
#hover-card{
  position:fixed;z-index:45;pointer-events:none;
  background:var(--card);border:2px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow);padding:10px 12px;font-size:13px;
  max-width:250px;
}
#hover-card .hc-title{font-weight:800;font-size:14px;font-family:var(--mono);margin-bottom:6px}
#hover-card .hc-cities{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
#hover-card .hc-mem{color:var(--ink-soft);line-height:1.5}
#hover-card .hc-tip{margin-top:6px;font-size:11px;color:var(--caramel-deep);font-family:var(--mono);font-weight:700}

/* ---------- 底部导航 ---------- */
#bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:space-around;
  background:var(--card);border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#bottomnav .nav-item{
  flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 4px 9px;background:none;border:none;font-size:11px;font-weight:700;color:var(--ink-soft);
  font-family:var(--mono);min-height:56px;justify-content:center;
}
#bottomnav .nav-item svg{display:block}
#bottomnav .nav-item.active{color:var(--caramel-deep);background:var(--sel-bg);box-shadow:inset 0 3px 0 var(--caramel)}
#bottomnav .nav-item:active{background:var(--press-bg)}

/* ---------- 底部面板 / 弹窗 ---------- */
#sheet-mask{
  position:fixed;inset:0;background:rgba(47,42,38,.4);z-index:60;
  animation:fadeIn .18s ease both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  max-width:560px;margin:0 auto;
  background:var(--card);border:2px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;
  max-height:82vh;overflow-y:auto;
  animation:sheetIn .25s cubic-bezier(.2,.8,.3,1) both;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
}
@keyframes sheetIn{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{
  position:sticky;top:0;display:flex;align-items:center;gap:10px;
  background:repeating-linear-gradient(135deg,#F6E3C6 0 10px,#F1D9B6 10px 20px);
  border-bottom:2px solid var(--line);padding:12px 16px;
}
.sheet-head .s-title{font-family:var(--mono);font-weight:800;font-size:16px;flex:1}
.sheet-body{padding:14px 16px}
/* 模态整套（含遮罩）层级高于抽屉：从抽屉中弹确认框时背后抽屉不可误点 */
#modal-root{position:relative;z-index:70}
#modal-mask{
  position:fixed;inset:0;background:rgba(47,42,38,.5);z-index:70;
  animation:fadeIn .18s ease both;
}
.modal{
  position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(520px,calc(100vw - 28px));max-height:86vh;overflow-y:auto;
  background:var(--card);border:2px solid var(--line);border-radius:8px;box-shadow:6px 6px 0 rgba(47,42,38,.25);
  animation:modalIn .22s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal .sheet-head{border-radius:6px 6px 0 0}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;font-family:var(--mono)}
.form-row input,.form-row select,.form-row textarea{
  width:100%;border:2px solid var(--line);border-radius:6px;background:#fff;
  padding:9px 11px;font-size:16px;
}
.form-row textarea{resize:vertical;min-height:64px}
.form-row .hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 搜索行：搜索框与重置按钮同行（重置不再独占一行，视觉上也不再像禁用态） */
.search-row{display:flex;gap:8px;flex:1 1 100%;align-items:stretch}
.foot-search{flex:1;min-width:0;border:2px solid var(--line);border-radius:6px;background:#fff;padding:9px 11px;font-size:16px}
.foot-search:focus{outline:2px solid var(--caramel);outline-offset:1px}
.search-row #f-reset{flex:none;min-width:60px;box-shadow:2px 2px 0 rgba(47,42,38,.14)}
.want-toggle{width:100%;text-align:left;background:none;border:none;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--caramel-deep);padding:8px 0 4px;cursor:pointer}
.want-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(47,42,38,.15)}
.want-row:last-child{border-bottom:none}
.want-row .btn{margin-left:auto}
.want-row .btn.danger{margin-left:0}
/* 足迹批量操作栏（多选态） */
.batch-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));z-index:58;
  display:flex;align-items:center;gap:10px;width:min(560px,calc(100vw - 24px));
  background:var(--card);border:2px solid var(--line);border-radius:8px;box-shadow:4px 4px 0 rgba(47,42,38,.2);
  padding:10px 14px;font-family:var(--mono);font-weight:700;font-size:13px}
.batch-bar .btn{margin-left:auto}
.batch-bar .btn.danger{margin-left:0}
.foot-check{display:flex;align-items:center;justify-content:center;width:28px;flex:0 0 28px}
.foot-check input{width:18px;height:18px;accent-color:var(--caramel)}
.foot-item.batch-mode{display:flex;gap:10px;align-items:flex-start}
.foot-item.batch-mode .f-wrap{flex:1;min-width:0}
@media print{.batch-bar{display:none!important}}
/* 「还有 N 条待处理」入口 */
@media (max-width:600px){
  .today-head.today-toggle{cursor:pointer}
  .today-sum{margin-left:auto;font-size:12px;color:var(--ink-soft);font-family:var(--mono)}
  .today-caret{margin-left:8px;font-size:12px;color:var(--caramel-deep)}
}
.today-more{display:block;width:100%;text-align:center;background:none;border:none;border-top:1px dashed rgba(47,42,38,.18);
  margin-top:4px;padding:8px 0 2px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--caramel-deep);cursor:pointer}
.today-more svg{vertical-align:-2px}
/* 快速记录悬浮按钮（FAB）：移动端主力入口，桌面端同样可用 */
.fab-note{
  position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:55;
  width:56px;height:56px;border:2px solid var(--line);border-radius:10px;
  background:var(--caramel);color:#FFFDF8;font-size:30px;font-weight:800;line-height:1;
  box-shadow:4px 4px 0 rgba(47,42,38,.25);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0 0 4px;
}
.fab-note:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(47,42,38,.25)}
@media print{.fab-note{display:none!important}}

/* ---------- Toast / 升级 ---------- */
/* top 由 JS 按同步提示条可见性设置（--toast-top），避免 toast 压在提示条上 */
#toast-root{position:fixed;left:50%;transform:translateX(-50%);top:var(--toast-top,70px);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{
  background:var(--ink);color:#FBF6EC;border:2px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow-sm);padding:9px 16px;font-size:13.5px;font-weight:700;
  animation:toastIn .25s cubic-bezier(.2,.8,.3,1) both;font-family:var(--mono);
}
.toast.ok{background:#2E5B3C}
.toast.warn{background:#8A4A1F}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
/* EXP 像素飘字（获得经验的正反馈，代替 EXP toast） */
#exp-float-root{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:85;pointer-events:none}
.exp-float{font-family:var(--mono);font-weight:800;font-size:22px;color:#FFFDF8;background:#C8763C;
  border:2px solid #2F2A26;border-radius:6px;box-shadow:3px 3px 0 rgba(47,42,38,.3);padding:6px 14px;
  animation:expFloat .48s cubic-bezier(.2,.7,.3,1) both}
@keyframes expFloat{0%{opacity:0;transform:translateY(14px) scale(.8)}18%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
#exp-fill,#chip-exp{transition:width .3s cubic-bezier(.2,.8,.3,1)}
#levelup-root{position:fixed;inset:0;z-index:90;pointer-events:none;display:flex;align-items:center;justify-content:center}
.levelup-card{
  background:var(--card);border:3px solid var(--line);border-radius:10px;box-shadow:6px 6px 0 rgba(47,42,38,.3);
  padding:26px 40px;text-align:center;animation:lvPop .5s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes lvPop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.levelup-card .lv-num{font-family:var(--mono);font-size:34px;font-weight:800;color:var(--caramel)}
.levelup-card .lv-txt{font-family:var(--mono);font-size:13px;color:var(--ink-soft);margin-top:4px}
.particle{position:fixed;width:8px;height:8px;background:var(--caramel);border:1.5px solid var(--line);z-index:91;pointer-events:none}

/* ---------- 桌面端：左侧导航 + 右侧内容（统一为侧边栏风格） ---------- */
@media (min-width:900px){
  body{font-size:15.5px}
  /* 三行：顶栏（通栏）→ 同步条（仅内容列）→ 内容列；左侧导航固定在视口，不随滚动/状态条移动 */
  #app{
    display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:22px;
    grid-template-rows:auto 1fr;
    max-width:1220px;margin:0 auto;align-items:start;position:relative;
  }
  #topbar{grid-column:1/-1;grid-row:1;margin:0 8px}
  /* 状态条：固定在侧边栏卡片正下方（不占内容行、不遮挡内容按钮，位置也完全稳定） */
  #sync-bar{
    position:fixed;z-index:45;
    left:max(8px, calc(50% - 610px));
    top:calc(var(--topbar-h, 63px) + 14px + var(--nav-h, 210px) + 12px);
    width:200px;margin:0;padding:8px 10px;border-radius:10px;
    display:flex;flex-direction:column;align-items:flex-start;gap:6px;
    font-size:11.5px;line-height:1.5;box-shadow:2px 2px 0 rgba(47,42,38,.15);
  }
  #sync-bar .btn.small{width:100%;min-height:32px;padding:4px 8px;font-size:12px}
  #views{grid-column:2;grid-row:2;max-width:none;margin:0;padding:14px 0 40px}
  #bottomnav{
    /* fixed：只依赖顶栏高度，与滚动、同步条显隐都无关（用户要求位置绝对稳定）。
       right/bottom 必须重置，否则会被基础样式的 right:0/bottom:0 拉伸到满屏高 */
    position:fixed;
    left:max(8px, calc(50% - 610px));
    top:calc(var(--topbar-h, 63px) + 14px);
    right:auto;bottom:auto;height:auto;
    width:200px;
    flex-direction:column;justify-content:flex-start;gap:4px;
    background:var(--card);border:2px solid var(--line);border-radius:10px;
    box-shadow:4px 4px 0 rgba(47,42,38,.12);
    padding:8px;margin:0;
  }
  #bottomnav .nav-item{
    flex:none;max-width:none;width:100%;flex-direction:row;justify-content:flex-start;
    gap:10px;min-height:46px;font-size:14px;border-radius:6px;padding:0 12px;
  }
  #bottomnav .nav-item.active{box-shadow:inset 3px 0 0 var(--caramel);background:var(--sel-bg)}
  #map-shell{height:clamp(460px,60vh,620px)}
  .sheet{max-width:560px;border-radius:12px;bottom:24px}
  .save-grid{grid-template-columns:repeat(4,1fr)}
  /* 悬浮工具统一放视口右下（FAB 与批量栏分属不同 Tab，不会同屏冲突） */
  .batch-bar{left:auto;right:24px;transform:none;bottom:24px;width:420px}
  .fab-note{bottom:28px;right:24px}
}
@media (max-width:400px){
  .form-2col{grid-template-columns:1fr}
  .save-grid{grid-template-columns:repeat(2,1fr)}
}
/* ---------- 焦点 / 表单错误 / 触控目标 ---------- */
/* 统一焦点环：用品牌焦糖替代浏览器默认 1px 黑环（只换颜色，不加装饰） */
*:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
/* 表单内联错误（沿用现有 --red，仅边框与提示文字，不新增卡片） */
.form-row.has-error input,.form-row.has-error select,.form-row.has-error textarea{border-color:var(--red);background:#FDF4F3}
.form-row .form-err{font-size:12px;color:var(--red);margin-top:4px;font-family:var(--mono);font-weight:700}
@media (max-width:600px){
  /* 触控目标补足 44px（移动端手指命中率） */
  .btn.small,#book-shuffle,#f-reset{min-height:44px}
}
/* ---------- 无障碍：尊重系统减弱动效偏好 ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
/* ---------- 打印：隐藏固定导航，避免每页重复 ---------- */
@media print{
  #bottomnav,#topbar,#toast-root,#levelup-root,#sheet-root,#modal-root{display:none!important}
  body{background:#fff}
}
</style>
